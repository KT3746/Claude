<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogos do KT3746</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #14171c;
    color: #f0f2f5;
  }
  main {
    max-width: 32rem;
    padding: 2rem;
    text-align: center;
  }
  h1 { margin: 0 0 0.5rem; font-size: 1.75rem; }
  p.lead { color: #a9b1bd; margin: 0 0 2rem; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.75rem; }
  a.game {
    display: block;
    padding: 1rem 1.25rem;
    border-radius: 0.75rem;
    background: #1e232b;
    color: inherit;
    text-decoration: none;
    border: 1px solid #2a303a;
    transition: border-color 0.15s ease;
  }
  a.game:hover, a.game:focus-visible { border-color: #5b8cff; }
  a.game strong { display: block; font-size: 1.1rem; }
  a.game span { color: #a9b1bd; font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Jogos do KT3746</h1>
  <p class="lead">Sem instalar nada — abra e jogue.</p>
  <ul>
    <li>
      <a class="game" href="minhocas/">
        <strong>Minhocas</strong>
        <span>Artilharia por turnos, estilo Worms</span>
      </a>
    </li>
    <li>
      <a class="game" href="https://kt3746.github.io/Claude-Arqueiro/">
        <strong>Arqueiro</strong>
        <span>Arco e flecha — agora em outro endereço</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
